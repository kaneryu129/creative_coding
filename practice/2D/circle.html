      def setup
        createCanvas(400, 400)
      end

      def draw
        background(100)
        
        # 縦と横に10個ずつ、合計100個の丸を並べる例
        (0..9).each do |i|
          (0..9).each do |j|
            # 塗りつぶしの色をランダムに変えてみる
            fill(rand(255), rand(255), rand(255))
            
            # x座標とy座標を計算して丸を描画
            x = 40 + (i * 35)
            y = 40 + (j * 35)
            circle(x, y, 20)
          end
        end
      end

      P5::init()
    </script>
